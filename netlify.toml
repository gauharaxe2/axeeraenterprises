# Admin sign-in and the enquiry API. These must stay above the 404 fallback.
# The functions read ADMIN_PASSWORD, ADMIN_SESSION_SECRET, and NETLIFY_API_TOKEN
# from the Netlify Functions environment and fail closed when those are missing.
[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200
  force = true
[[redirects]]
  from = "/api/admin/logout"
  to = "/.netlify/functions/admin-logout"
  status = 200
  force = true
[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/admin-session"
  status = 200
  force = true
[[redirects]]
  from = "/api/admin/submissions"
  to = "/.netlify/functions/admin-submissions"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301

# Real app paths. Must stay above the 404 fallback.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/policies"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/policies/"
  to = "/index.html"
  status = 200

# Unknown paths: SPA shell with a real HTTP 404. The app shows the Not Found page.
# Do not change this to status 200 — that was the soft-404 catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
