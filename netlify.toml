# Redirects match top to bottom. Existing files (ads.txt, robots.txt, sitemap.xml,
# assets, form-received.html) win because these rules are not forced.
#
# Legacy multi-page URLs 301 to the closest section of this app.
# /web-design lands on Web Development: the new site has no separate web-design
# service, and website design/build now lives there. Brand Design stays the
# identity service. Unknown paths serve the SPA with HTTP 404 (not a 200 rewrite).

# --- Legacy service pages ---
