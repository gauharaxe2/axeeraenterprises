<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axe's Era Enterprise by Gauhar Axe - Digital Solutions</title>
    <meta name="description" content="Axe's Era Enterprise by Gauhar Axe - Professional digital solutions company specializing in web design, branding, and technology services." />
    <meta property="og:title" content="Axe's Era Enterprise by Gauhar Axe - Digital Solutions" />
    <meta property="og:description" content="Axe's Era Enterprise by Gauhar Axe - Professional digital solutions company specializing in web design, branding, and technology services." />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/q62QnRNR/Axe-s-Era-company-logo-20260808-065813-0000.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <!--
      Static Netlify Forms definition. The visible form is rendered by React,
      so Netlify cannot see it at deploy time unless this matching form is in
      the published HTML. Field names must stay in sync with the React form.
    -->
    <form
      name="contact"
      method="POST"
      action="/form-received"
      data-netlify="true"
      netlify-honeypot="bot-field"
      data-form-skeleton="contact"
      hidden
      style="display: none"
    >
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>
          Don’t fill this out if you're human:
          <input name="bot-field" />
        </label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
